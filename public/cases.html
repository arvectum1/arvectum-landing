<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arvectum</title>
    <meta id="metaDescription" name="description" content="" />
    <meta id="metaOgTitle" property="og:title" content="" />
    <meta id="metaOgDescription" property="og:description" content="" />
    <meta property="og:type" content="website" />
    <meta id="metaOgLocale" property="og:locale" content="ru_RU" />
    <meta name="theme-color" content="#041A33" />
    <link
      rel="icon"
      type="image/png"
      href="assets/brand/arvectum-logo-primary.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260615b" />
  </head>
  <body data-page="cases">
    <a class="skip-link" href="#pageRoot" id="skipLink"
      >Перейти к содержимому</a
    >
    <header class="site-header">
      <div class="container">
        <div class="header-shell glass">
          <div class="topbar">
            <a class="brand" href="index.html" aria-label="Arvectum">
              <img
                id="brandLogo"
                src="assets/brand/arvectum-logo-header-light.png"
                alt="Arvectum logo"
              />
              <span class="brand-meta" id="brandMeta">Arvectum LLC</span>
            </a>
            <nav
              class="desktop-nav"
              id="desktopNav"
              aria-label="Main navigation"
            ></nav>
            <div class="topbar-tools">
              <div class="lang-switch" aria-label="Language switcher">
                <button
                  class="lang-switch__button is-active"
                  id="langRu"
                  type="button"
                  data-lang="ru"
                >
                  RU
                </button>
                <button
                  class="lang-switch__button"
                  id="langEn"
                  type="button"
                  data-lang="en"
                >
                  EN
                </button>
              </div>
              <a
                class="button button-ghost desktop-action"
                id="topbarTelegram"
                href="https://t.me/arvectum"
                target="_blank"
                rel="noreferrer"
                >Telegram</a
              >
              <a
                class="button desktop-action"
                id="topbarCta"
                href="contact.html"
                >Разобрать процесс</a
              >
              <button class="menu-toggle" id="menuToggle" type="button">
                <span id="menuButtonText">Menu</span>
              </button>
            </div>
          </div>
          <div class="mobile-actions">
            <a
              class="button button-ghost"
              id="mobileTelegram"
              href="https://t.me/arvectum"
              target="_blank"
              rel="noreferrer"
              >Telegram</a
            >
            <a class="button" id="mobileCta" href="contact.html"
              >Разобрать процесс</a
            >
          </div>
        </div>
      </div>
      <div class="menu-drawer" id="menuDrawer">
        <div class="menu-drawer__panel glass">
          <div class="menu-drawer__top">
            <div>
              <p class="eyebrow" id="menuTitle">Навигация по сайту</p>
              <h2 id="menuSectionTitle">Разделы</h2>
            </div>
            <button class="menu-close" id="menuClose" type="button">
              <span id="menuCloseText">Закрыть меню</span>
            </button>
          </div>
          <nav class="menu-nav" id="menuNav" aria-label="Site navigation"></nav>
          <a class="button" id="menuPrimaryCta" href="contact.html"
            >Разобрать процесс</a
          >
        </div>
      </div>
    </header>
    <main id="pageRoot"></main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-grid glass">
          <div class="footer-lead">
            <h2>Arvectum</h2>
            <p id="footerLead"></p>
            <a class="text-link" id="footerPrimaryLink" href="contact.html"
              >Contact</a
            >
          </div>
          <div class="footer-column">
            <span id="footerLinksTitle"></span>
            <div class="footer-links" id="footerLinks"></div>
          </div>
          <div class="footer-column">
            <span id="footerDirectTitle"></span>
            <div class="footer-links">
              <a href="mailto:info@arvectum.com">info@arvectum.com</a>
              <a
                id="footerTelegramLink"
                href="https://t.me/arvectum"
                target="_blank"
                rel="noreferrer"
                >t.me/arvectum</a
              >
            </div>
          </div>
          <div class="footer-column">
            <span id="footerRequisitesTitle"></span>
            <dl class="footer-requisites" id="footerRequisites"></dl>
          </div>
        </div>
      </div>
    </footer>
    <section class="cookie-banner glass" id="cookieBanner" hidden>
      <div class="cookie-banner__content">
        <p class="cookie-banner__eyebrow" id="cookieBannerEyebrow"></p>
        <h2 id="cookieBannerTitle"></h2>
        <p id="cookieBannerText"></p>
      </div>
      <div class="cookie-banner__actions">
        <button
          class="button button-ghost"
          id="cookieDeclineBtn"
          type="button"
        ></button>
        <button
          class="button button-ghost"
          id="cookieCustomizeBtn"
          type="button"
        ></button>
        <button class="button" id="cookieAcceptBtn" type="button"></button>
      </div>
    </section>
    <section class="cookie-modal-backdrop" id="cookieModalBackdrop" hidden>
      <div
        class="cookie-modal glass"
        id="cookieModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cookieModalTitle"
      >
        <div class="cookie-modal__header">
          <div>
            <p class="cookie-banner__eyebrow" id="cookiePrefsEyebrow"></p>
            <h2 id="cookieModalTitle"></h2>
          </div>
          <button
            class="cookie-modal__close"
            id="cookieModalClose"
            type="button"
          >
            ×
          </button>
        </div>
        <div class="cookie-modal__body">
          <article class="cookie-option">
            <div>
              <h3 id="cookieEssentialTitle"></h3>
              <p id="cookieEssentialText"></p>
            </div>
            <label class="cookie-switch cookie-switch--locked"
              ><input type="checkbox" checked disabled /><span
                id="cookieEssentialAlwaysOn"
              ></span
            ></label>
          </article>
          <article class="cookie-option">
            <div>
              <h3 id="cookieAnalyticsTitle"></h3>
              <p id="cookieAnalyticsText"></p>
            </div>
            <label class="cookie-switch"
              ><input type="checkbox" id="cookieAnalyticsToggle" /><span
                id="cookieAnalyticsLabel"
              ></span
            ></label>
          </article>
        </div>
        <div class="cookie-modal__footer">
          <button
            class="button button-ghost"
            id="cookieSaveEssentialBtn"
            type="button"
          ></button>
          <button class="button" id="cookieSavePrefsBtn" type="button"></button>
        </div>
      </div>
    </section>
    <script src="site-config.js?v=20260615b"></script>
    <script src="app.js?v=20260615b"></script>
  </body>
</html>
